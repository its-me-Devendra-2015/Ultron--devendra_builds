name: ULTRON 2.0 Foundation

on:
  push:
    branches: [feature/ultron-2-foundation]
  pull_request:
    branches: [upgrade/1.3.3-advanced-desktop]

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run protocol tests
        run: node --test test/protocol.test.js
